# Copy this file to config.properties and edit the local copy.
# These values are read when Gradle builds the APK.

catalog.url=https://radios.example.com/radio_list.json

# Download pytorch_model.bin from https://huggingface.co/charactr/vocos-encodec-24khz
# and export it to app/src/main/assets/vocos-encodec-24khz-f32.bin before building.
# The pretrained model is not stored in Git.
decoder.modelAsset=vocos-encodec-24khz-f32.bin
decoder.modelSha256=58eb4c8daacf3b21667a40935ef6028d6ac253978778d505e24b0f539faf647e

# Milliseconds. Catalog and live stream requests use separate timeouts.
network.catalogConnectTimeoutMs=12000
network.catalogReadTimeoutMs=12000
network.fileConnectTimeoutMs=15000
network.fileReadTimeoutMs=30000
network.liveConnectTimeoutMs=1000
network.liveReadTimeoutMs=2000

# Prefetch target in milliseconds of audio. Playback never waits for this target.
# Prefetch capacity is a segment count. Startup lookback is audio duration;
# 12 seconds matches six 2-second segments and adapts to manifest durations.
live.bufferTargetMs=30000
live.maxBufferSegments=12
live.startupLookbackMs=30000
